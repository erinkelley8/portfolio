[project]
name = "portfolio"
version = "0.1.0"
description = "Governed, reproducible data projects on open datasets"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "sqlfluff>=3.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tools", "projects"]

[tool.sqlfluff.core]
dialect = "duckdb"
max_line_length = 120
